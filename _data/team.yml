investigators:
  - name: Muhammad Ismail
    institution: tntech
    title: Associate Professor of Computer Science; Director, Cybersecurity Education, Research and Outreach Center (CEROC)
    expertise: AI-enabled resource management and generalizable AI under concept drift.
    focus: Coordinates the project. Works on AI-native resource management and generalizable AI.
    url: https://www.tntech.edu/directory/ceroc/muhammad-ismail.php
    photo: ""

  - name: Sabit Ekin
    institution: tamu
    title: Associate Professor and Charlotte and Walter Buchanan Faculty Fellow, Electronic Systems Engineering Technology (ESET); Director, Generative AI Literacy Initiative, Texas A&M Institute of Data Science
    expertise: Fresnel metallic reflector array (MRA) design, deployment, parameter configuration, channel measurement, and modeling.
    focus: Leads Texas A&M's part of the project, focusing on FR3 channel measurements and modeling.
    url: https://engineering.tamu.edu/etid/profiles/ekin-sabit.html
    photo: ""

  - name: Ted Rappaport
    institution: nyu
    title: David Lee/Ernst Weber Professor of Electrical Engineering, NYU Tandon School of Engineering; Founding Director, NYU WIRELESS
    expertise: FR3 and high-frequency propagation measurements and channel modeling.
    focus: Advises on FR3 measurements and channel modeling.
    url: https://wireless.engineering.nyu.edu/tedrappaport/
    photo: ""

  - name: Ertugrul Basar
    institution: tampere
    title: Professor of Wireless Systems; Head, Wireless Systems Group, Tampere Wireless Research Center
    expertise: Reconfigurable intelligent surface (RIS) design, deployment, configuration, channel measurement, and modeling.
    focus: Works on RIS-enabled programmable wireless environments. Hosts the FR3 RIS testbed at Tampere.
    url: https://www.tuni.fi/en/people/ertugrul-basar
    photo: ""

  - name: Risto Wichman
    institution: aalto
    title: Professor, Department of Information and Communications Engineering, School of Electrical Engineering
    expertise: AI-enabled beamforming and integrated sensing and communication (ISAC).
    focus: Works on integrated sensing and communication (ISAC) for context-aware AI.
    url: https://www.aalto.fi/en/people/risto-wichman
    photo: ""

