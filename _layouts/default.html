<!doctype html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body class="{{ page.body_class }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  {% if page.scripts %}{% for s in page.scripts %}
  <script src="{{ s | relative_url }}" defer></script>{% endfor %}{% endif %}
</body>
</html>
